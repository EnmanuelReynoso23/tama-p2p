  <rect x="17" y="18" width="1" height="1" fill="#2b2138"/>
  <rect x="15" y="19" width="2" height="1" fill="#2b2138"/>
  <!-- flame (streak) -->
  <path fill="#2b2138" d="M23 3h2v1h1v1h1v2h1v4h-1v1h-1v1h-4v-1h-1v-1h-1V8h1V7h1v1h1V5h-1V4h1z"/>
  <path fill="#ff7a1a" d="M23 4h2v1h1v2h1v4h-1v1h-4v-1h-1V8h1v1h1V6h1V5h-1z"/>
  <path fill="#ffd166" d="M24 7h1v1h1v3h-3v-2h1z"/>
