  <rect x="10" y="10" width="3" height="1" fill="#ffffff"/>
  <rect x="9" y="11" width="1" height="2" fill="#ffffff"/>
  <!-- eyes -->
  <rect x="11" y="14" width="2" height="3" fill="#2b2138"/>
  <rect x="19" y="14" width="2" height="3" fill="#2b2138"/>
  <rect x="11" y="14" width="1" height="1" fill="#ffffff"/>
  <rect x="19" y="14" width="1" height="1" fill="#ffffff"/>
  <!-- blush -->
